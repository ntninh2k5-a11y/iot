<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tổng Quan - Smart Shelf IoT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar">
  <div class="logo"><i class="bi bi-boxes"></i> Smart Shelf IoT</div>
  <nav>
    <a href="index.html" class="active"><span class="icon"><i class="bi bi-speedometer2"></i></span><span>Tổng Quan</span></a>
    <a href="products.html"><span class="icon"><i class="bi bi-tags"></i></span><span>Sản Phẩm</span></a>
    <a href="assign.html"><span class="icon"><i class="bi bi-card-checklist"></i></span><span>Quy Định Kệ</span></a>
    <a href="history.html"><span class="icon"><i class="bi bi-clock-history"></i></span><span>Lịch Sử Kho</span></a>
    <a href="settings.html"><span class="icon"><i class="bi bi-gear"></i></span><span>Cài Đặt</span></a>
  </nav>
  <div class="sys-info">
    <div><span class="dot on" id="sysStatus"></span> Hệ thống hoạt động</div>
    <div style="margin-top:6px;font-size:10px" id="lastUpdate">Cập nhật: --</div>
  </div>
</aside>

<div class="toast-container" id="toastContainer"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Chi tiết</h2>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="main">
  <div class="page-header">
    <h1><i class="bi bi-bar-chart-fill"></i> Tổng Quan Hệ Thống</h1>
    <p>Giám sát trạng thái kệ hàng theo thời gian thực</p>
  </div>
  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-grid-1x2"></i></div><div><div class="stat-val" id="statTotal">4</div><div class="stat-label">Tổng ngăn kệ</div></div></div>
    <div class="stat-card"><div class="stat-icon green"><i class="bi bi-check-circle"></i></div><div><div class="stat-val" id="statOccupied">0</div><div class="stat-label">Đang chứa hàng</div></div></div>
    <div class="stat-card"><div class="stat-icon red"><i class="bi bi-exclamation-triangle"></i></div><div><div class="stat-val" id="statEmpty">0</div><div class="stat-label">Ngăn trống</div></div></div>
    <div class="stat-card"><div class="stat-icon orange"><i class="bi bi-graph-up-arrow"></i></div><div><div class="stat-val" id="statToday">0</div><div class="stat-label">Nhập/Xuất hôm nay</div></div></div>
  </div>
  <h2 style="font-size:18px;margin-bottom:16px"><i class="bi bi-hdd-stack"></i> Trạng Thái Kệ Hàng</h2>
  <div class="shelf-grid" id="shelfGrid"></div>
</div>

<script src="js/utils.js?v=5"></script>
<script src="js/toast.js?v=5"></script>
<script src="js/modal.js?v=5"></script>
<script src="js/dashboard.js?v=5"></script>
<script>
loadDashboard();
setInterval(loadDashboard, 3000);
</script>

</body>
</html>
